#   pdf      direct link to the PDF           -> "pdf" button
#   bibtex   BibTeX entry, block scalar       -> "bibtex" button, expands inline
#   code     repository URL                   -> "code" button
#   links    optional extras, list of {label, url}, rendered after the above

