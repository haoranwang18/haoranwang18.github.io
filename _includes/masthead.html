<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__actions">
      <button class="masthead__action search-toggle" type="button" data-search-open aria-label="Search this site" title="Search (&#8984;K)">
        <kbd class="search-toggle__shortcut">&#8984;K</kbd>
        <i class="fas fa-search" aria-hidden="true"></i>
      </button>
      <button id="theme-toggle" class="masthead__action theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
        <i class="fas fa-fw fa-moon theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true"></i>
        <i class="fas fa-fw fa-sun theme-toggle__icon theme-toggle__icon--light" aria-hidden="true"></i>
      </button>
    </div>
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {%- comment -%}
            The wordmark. This was "#about-me", a bare in-page anchor, so it
            went nowhere from any page but the homepage.
          {%- endcomment -%}
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="{{ '/' | relative_url }}">{{ site.author.name }}</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
